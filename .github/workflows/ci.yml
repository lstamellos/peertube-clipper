name: CI

on:
  push:
  pull_request:

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: python -m pip install -e 'services/clip-bridge[dev]' -e 'services/analysis-worker[dev]'
      - run: python -m compileall -q services/clip-bridge/clip_bridge services/analysis-worker/clipper_worker
      - run: pytest -q services/clip-bridge/tests services/analysis-worker/tests
