[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peertube-clipper-analysis-worker"
version = "0.1.0a3"
description = "Local caption analysis worker for PeerTube Clipper"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
peertube-clipper-analysis-worker = "clipper_worker.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clipper_worker*"]